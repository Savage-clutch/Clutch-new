<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Win a 2024 BMW X5 — Clutch</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    /* =====================================================
       COWBOY-INSPIRED DESIGN SYSTEM
       Cream + Black · Editorial · Minimal
    ===================================================== */

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; scroll-behavior: smooth; }

    body {
      font-family: 'Helvetica Neue', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F0EAE1;
      color: #0A0A0A;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }

    /* Layout */
    .wrap      { max-width: 1200px; margin: 0 auto; padding: 0 clamp(24px, 5vw, 80px); }
    .wrap-sm   { max-width:  860px; margin: 0 auto; padding: 0 clamp(24px, 5vw, 80px); }

    /* Backgrounds */
    .bg-black { background: #0A0A0A; color: #fff; }
    .bg-cream { background: #F0EAE1; color: #0A0A0A; }

    /* Typography */
    .t-display {
      font-size: clamp(48px, 7.5vw, 108px);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 0.92;
      margin: 0;
    }
    .t-headline {
      font-size: clamp(28px, 4vw, 58px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 0.96;
      margin: 0;
    }
    .t-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .t-body  { font-size: 16px; line-height: 1.65; font-weight: 400; }
    .t-small { font-size: 13px; line-height: 1.55; }

    .dim-dark  { color: rgba(10,10,10,.5); }
    .dim-light { color: rgba(255,255,255,.45); }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 15px 32px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 14px; font-weight: 600; letter-spacing: 0.01em;
      cursor: pointer; border: none; white-space: nowrap;
      transition: opacity .18s ease, transform .12s ease;
    }
    .btn:hover  { opacity: 0.72; }
    .btn:active { transform: scale(.97); }
    .btn-ink    { background: #0A0A0A; color: #fff; }
    .btn-white  { background: #fff;    color: #0A0A0A; }
    .btn-coral  { background: #FF464C; color: #fff; }
    .btn-outline-dark  { background: transparent; border: 1.5px solid rgba(10,10,10,.45); color: #0A0A0A; }
    .btn-outline-light { background: transparent; border: 1.5px solid rgba(255,255,255,.35); color: #fff; }
    .btn-lg { padding: 18px 44px; font-size: 16px; }

    /* Nav */
    .c-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 72px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 clamp(24px, 5vw, 64px);
      transition: background .35s ease, border-color .35s ease;
      border-bottom: 1px solid transparent;
    }
    .c-nav.scrolled {
      background: rgba(10,10,10,.88);
      backdrop-filter: saturate(1.5) blur(20px);
      -webkit-backdrop-filter: saturate(1.5) blur(20px);
      border-bottom-color: rgba(255,255,255,.08);
    }

    /* Hero */
    .c-hero {
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex; flex-direction: column;
    }
    .c-hero-img {
      position: absolute;
      bottom: -2%;
      left: 50%;
      transform: translateX(-50%);
      width: 100%; max-width: 1080px;
      z-index: 2;
      pointer-events: none;
      user-select: none;
    }
    .c-hero-fade {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 40%;
      background: linear-gradient(to bottom, transparent, #0A0A0A);
      z-index: 3;
    }

    /* Countdown */
    .c-clock { display: flex; align-items: flex-end; gap: 4px; }
    .c-clock-unit { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .c-clock-n {
      font-size: clamp(24px, 3.2vw, 44px);
      font-weight: 800; letter-spacing: -0.04em; line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .c-clock-sep {
      font-size: clamp(20px, 2.6vw, 34px);
      font-weight: 300; color: rgba(255,255,255,.25); line-height: 1;
      margin-bottom: 10px; padding: 0 4px;
    }
    .c-clock-lbl { font-size: 9px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.3); }

    /* Stats grid — cream section */
    .c-stats {
      display: grid; grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid rgba(10,10,10,.1);
      border-left: 1px solid rgba(10,10,10,.1);
    }
    .c-stat {
      padding: 40px 32px;
      border-right: 1px solid rgba(10,10,10,.1);
      border-bottom: 1px solid rgba(10,10,10,.1);
    }
    .c-stat-n {
      font-size: clamp(36px, 4.5vw, 68px);
      font-weight: 800; letter-spacing: -0.04em; line-height: 1;
      margin-bottom: 8px;
    }

    /* How to Win — black grid */
    .c-steps {
      display: grid; grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid rgba(255,255,255,.1);
      border-left: 1px solid rgba(255,255,255,.1);
    }
    .c-step {
      padding: 44px 36px;
      border-right: 1px solid rgba(255,255,255,.1);
      border-bottom: 1px solid rgba(255,255,255,.1);
    }
    .c-step-pts {
      font-size: clamp(44px, 6vw, 72px);
      font-weight: 800; letter-spacing: -0.04em; line-height: 1;
    }

    /* Spec accordion */
    .c-spec-list { border-top: 1px solid rgba(255,255,255,.1); }
    .c-spec-item { border-bottom: 1px solid rgba(255,255,255,.08); cursor: pointer; }

    /* Enter section — form steps */
    .c-form-row {
      padding: 56px 0;
      border-bottom: 1px solid rgba(10,10,10,.1);
    }
    .c-form-row:first-child { padding-top: 0; }
    .c-form-row:last-child  { border-bottom: none; padding-bottom: 0; }

    /* Field — bottom-border style */
    .c-field-wrap { display: block; }
    .c-field-lbl {
      font-size: 10px; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: rgba(10,10,10,.45);
      margin-bottom: 6px; display: block;
    }
    .c-field {
      width: 100%; padding: 14px 0;
      background: transparent;
      border: none; border-bottom: 1.5px solid rgba(10,10,10,.18);
      font-family: inherit; font-size: 16px; color: #0A0A0A;
      outline: none;
      transition: border-color .15s;
    }
    .c-field:focus      { border-bottom-color: #0A0A0A; }
    .c-field::placeholder { color: rgba(10,10,10,.28); }

    /* FAQ */
    .c-faq-item { border-bottom: 1px solid rgba(255,255,255,.08); }
    .c-faq-trigger {
      width: 100%; padding: 22px 0;
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      background: none; border: none; cursor: pointer;
      font-family: inherit; color: inherit; text-align: left;
    }

    /* Terms */
    #ct-terms p { margin: 0 0 8px; }
    #ct-terms p:last-child { margin: 0; }
    #ct-terms strong { font-weight: 700; color: #0A0A0A; }

    /* Section spacing */
    section[id] { scroll-margin-top: 72px; }

    /* Confetti */
    @keyframes confCowboy {
      0%   { opacity: 0; transform: translate(0,0) scale(.5) rotate(0deg); }
      8%   { opacity: 1; }
      100% { opacity: 0; transform: translate(var(--vx), var(--vy)) scale(.9) rotate(var(--rot)); }
    }

    /* Mobile */
    @media (max-width: 700px) {
      .c-steps { grid-template-columns: 1fr; }
      .c-stats  { grid-template-columns: repeat(2, 1fr); }
      .two-col  { grid-template-columns: 1fr !important; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="text/babel" data-plugins="transform-react-jsx-source" data-filename="cowboy.html">
    const { useState, useEffect, useRef } = React;

    /* ─── Countdown ─── */
    function useCountdown(iso) {
      const [now, setNow] = useState(Date.now());
      useEffect(() => {
        const id = setInterval(() => setNow(Date.now()), 1000);
        return () => clearInterval(id);
      }, []);
      const diff = Math.max(0, new Date(iso).getTime() - now);
      return {
        days:  Math.floor(diff / 86400000),
        hours: Math.floor((diff % 86400000) / 3600000),
        mins:  Math.floor((diff % 3600000) / 60000),
        secs:  Math.floor((diff % 60000) / 1000),
      };
    }

    function ClockUnit({ value, label }) {
      const str = String(value).padStart(2, '0');
      return (
        <div className="c-clock-unit">
          <span className="c-clock-n">{str}</span>
          <span className="c-clock-lbl">{label}</span>
        </div>
      );
    }

    /* ─── Nav ─── */
    function Nav({ onCta }) {
      const [scrolled, setScrolled] = useState(false);
      useEffect(() => {
        const h = () => setScrolled(window.scrollY > 40);
        window.addEventListener('scroll', h, { passive: true });
        return () => window.removeEventListener('scroll', h);
      }, []);
      return (
        <nav className={`c-nav${scrolled ? ' scrolled' : ''}`}>
          <img src="assets/logo-red.webp" alt="Clutch" style={{ height: 22, width: 'auto', display: 'block' }} />
          <button className="btn btn-white" onClick={onCta} style={{ fontSize: 13, padding: '12px 24px' }}>
            Enter the Giveaway
          </button>
        </nav>
      );
    }

    /* ─── Hero ─── */
    function Hero({ deadlineIso, onCtaClick }) {
      const { days, hours, mins, secs } = useCountdown(deadlineIso);
      const [scroll, setScroll] = useState(0);
      const [openSpec, setOpenSpec] = useState(null);

      useEffect(() => {
        const h = () => setScroll(window.scrollY);
        window.addEventListener('scroll', h, { passive: true });
        return () => window.removeEventListener('scroll', h);
      }, []);

      const toggle = k => setOpenSpec(openSpec === k ? null : k);

      const specs = [
        { key: 'power', label: 'Horsepower',    value: '335 hp',           detail: 'Turbocharged 3.0L inline-6 delivering 335 hp and 330 lb-ft of torque. 0–100 km/h in 5.8 seconds.' },
        { key: 'drive', label: 'Drivetrain',     value: 'xDrive AWD',       detail: 'BMW intelligent xDrive all-wheel drive distributes torque to the wheels with most grip — automatically, in milliseconds.' },
        { key: 'trans', label: 'Transmission',   value: '8-spd Sport auto', detail: '8-speed sport automatic with paddle shifters and adaptive shift logic. Launch control included.' },
        { key: 'fuel',  label: 'Fuel (L/100 km)', value: '10.2 city · 7.8 hwy', detail: 'Combined 9.1 L/100 km thanks to a 48V mild-hybrid system. Premium fuel recommended.' },
        { key: 'seats', label: 'Seating',        value: '5 seats',          detail: 'Spacious seating for 5 with premium leather upholstery. Heated front seats, memory settings, and panoramic sunroof.' },
      ];

      return (
        <>
          {/* ── FULL-VIEWPORT HERO ── */}
          <section className="c-hero bg-black">
            {/* Upper text block */}
            <div style={{ position: 'relative', zIndex: 5, padding: 'clamp(100px,10vh,130px) clamp(24px,5vw,80px) 0', maxWidth: 840 }}>
              <div className="t-label dim-light" style={{ marginBottom: 20 }}>
                Clutch Certified Giveaway
              </div>
              <h1 className="t-display" style={{ color: 'white', marginBottom: 28 }}>
                Win a Clutch Certified 2024 BMW X5.
              </h1>
              <p style={{ fontSize: 17, color: 'rgba(255,255,255,.55)', margin: '0 0 36px', maxWidth: 500, lineHeight: 1.55 }}>
                Enter for a chance to win a free 2024 BMW X5 and experience Clutch Certified first hand.
              </p>
              <div style={{ display: 'flex', alignItems: 'center', gap: 20, flexWrap: 'wrap' }}>
                <button className="btn btn-white btn-lg" onClick={onCtaClick}>Enter the Giveaway</button>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                  {[0,1,2,3,4].map(i => (
                    <svg key={i} width="12" height="12" viewBox="0 0 24 24">
                      <path d="M12 2l2.9 6.6L22 9.5l-5.2 5 1.4 7.3L12 18.3 5.8 21.8l1.4-7.3L2 9.5l7.1-.9L12 2z" fill="#FBBC05"/>
                    </svg>
                  ))}
                  <span style={{ fontSize: 13, color: 'rgba(255,255,255,.45)', marginLeft: 4 }}>4.8 · 3,400+ Google reviews</span>
                </div>
              </div>
            </div>

            {/* Car image — fills lower 65% of viewport */}
            <img
              src="assets/bmw-x5.avif"
              alt="2024 BMW X5"
              className="c-hero-img"
              style={{ transform: `translateX(-50%) translateY(${scroll * 0.07}px)` }}
            />
            <div className="c-hero-fade" />

            {/* Bottom bar — countdown + fine print */}
            <div style={{
              position: 'relative', zIndex: 5, marginTop: 'auto',
              padding: '0 clamp(24px,5vw,80px) 44px',
              display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 24, flexWrap: 'wrap',
            }}>
              <div>
                <div className="t-label dim-light" style={{ marginBottom: 10 }}>Ends in</div>
                <div className="c-clock">
                  <ClockUnit value={days}  label="Days" />
                  <span className="c-clock-sep">:</span>
                  <ClockUnit value={hours} label="Hrs" />
                  <span className="c-clock-sep">:</span>
                  <ClockUnit value={mins}  label="Min" />
                  <span className="c-clock-sep">:</span>
                  <ClockUnit value={secs}  label="Sec" />
                </div>
              </div>
              <p style={{ fontSize: 12, color: 'rgba(255,255,255,.28)', margin: 0, textAlign: 'right' }}>
                Est. value C$50,000 · No purchase necessary · Ontario residents 18+
              </p>
            </div>
          </section>

          {/* ── SPECS — same black bg, no visual break ── */}
          <section className="bg-black" style={{ padding: '0 0 120px' }}>
            <div className="wrap" style={{ maxWidth: 1000 }}>
              <div style={{
                display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end',
                flexWrap: 'wrap', gap: 20, marginBottom: 0,
                paddingBottom: 28, borderBottom: '1px solid rgba(255,255,255,.1)',
              }}>
                <div>
                  <div className="t-label dim-light" style={{ marginBottom: 10 }}>Under the Hood</div>
                  <h3 style={{ fontSize: 26, fontWeight: 800, letterSpacing: '-0.025em', color: 'white', margin: 0 }}>
                    2024 BMW X5 xDrive specs
                  </h3>
                </div>
                <p style={{ fontSize: 14, color: 'rgba(255,255,255,.38)', margin: 0, maxWidth: 340, textAlign: 'right', lineHeight: 1.5 }}>
                  Turbocharged inline-6, intelligent AWD, premium leather cabin.
                </p>
              </div>

              <div className="c-spec-list">
                {specs.map(s => {
                  const isOpen = openSpec === s.key;
                  return (
                    <div key={s.key} className="c-spec-item" onClick={() => toggle(s.key)}>
                      <div style={{ padding: '18px 0', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 16 }}>
                        <div style={{ flex: 1 }}>
                          <div className="t-label dim-light" style={{ marginBottom: 5 }}>{s.label}</div>
                          <div style={{ fontSize: 18, fontWeight: 700, color: isOpen ? '#FF464C' : 'white', transition: 'color .2s', letterSpacing: '-0.01em' }}>
                            {s.value}
                          </div>
                        </div>
                        <svg style={{
                          width: 14, height: 14, flexShrink: 0,
                          color: isOpen ? '#FF464C' : 'rgba(255,255,255,.3)',
                          transform: isOpen ? 'rotate(45deg)' : 'none',
                          transition: 'transform .3s cubic-bezier(.16,1,.3,1), color .2s',
                        }} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round">
                          <path d="M12 5v14M5 12h14"/>
                        </svg>
                      </div>
                      <div style={{ maxHeight: isOpen ? 100 : 0, overflow: 'hidden', transition: 'max-height .4s cubic-bezier(.16,1,.3,1)' }}>
                        <p style={{ paddingBottom: 20, fontSize: 14, color: 'rgba(255,255,255,.48)', lineHeight: 1.65, margin: 0 }}>{s.detail}</p>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </section>
        </>
      );
    }

    /* ─── Why Certified ─── */
    function WhyCertified() {
      const stats = [
        { n: '70,000+', label: 'Vehicles inspected' },
        { n: '210',     label: 'Inspection points' },
        { n: '23',      label: 'Certified mechanics per vehicle' },
        { n: '3×',      label: 'Mechanic-led road tests' },
      ];
      return (
        <section className="bg-cream" style={{ padding: '120px 0' }}>
          <div className="wrap">
            {/* Chrome badge — centered, large */}
            <div style={{ textAlign: 'center', marginBottom: 80 }}>
              <img
                src="assets/clutch-certified-chrome-v2.png"
                alt="Clutch Certified"
                style={{ maxWidth: 680, width: '100%', display: 'block', margin: '0 auto' }}
              />
            </div>

            {/* Heading + body — two column */}
            <div className="two-col" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 64, alignItems: 'end', marginBottom: 56 }}>
              <div>
                <div className="t-label dim-dark" style={{ marginBottom: 16 }}>What is Clutch Certified?</div>
                <h2 className="t-headline">
                  Every vehicle inspected, serviced, and certified by a real mechanic.
                </h2>
              </div>
              <p className="t-body dim-dark" style={{ margin: 0 }}>
                Every vehicle is inspected, serviced, detailed, and certified in person by a Clutch mechanic — so you know exactly what you're getting. The prize BMW X5 arrives fully ready to drive from day one.
              </p>
            </div>

            {/* Stats grid */}
            <div className="c-stats">
              {stats.map((s, i) => (
                <div key={i} className="c-stat">
                  <div className="c-stat-n">{s.n}</div>
                  <div className="t-small dim-dark">{s.label}</div>
                </div>
              ))}
            </div>

            {/* CTA strip */}
            <div style={{
              marginTop: 56, paddingTop: 40, borderTop: '1px solid rgba(10,10,10,.1)',
              display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 20,
            }}>
              <p className="t-body dim-dark" style={{ margin: 0, maxWidth: 440 }}>
                Every prize vehicle arrives fully inspected, serviced, and certified — ready to drive from day one.
              </p>
              <button className="btn btn-ink btn-lg" onClick={() => {
                const el = document.getElementById('enter');
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
              }}>
                Enter the Giveaway
              </button>
            </div>
          </div>
        </section>
      );
    }

    /* ─── How to Win ─── */
    function HowToWin({ onStepClick }) {
      const steps = [
        { n: 1, pts: '5',   ptsUnit: 'Points',      title: 'Name and email',    desc: 'Drop your name, email, and social handle to officially enter. Takes about 10 seconds.', tag: 'Required', duration: '~10 sec' },
        { n: 2, pts: '100', ptsUnit: 'Pts / vehicle', title: 'Get a vehicle offer', desc: 'Get a free instant cash offer on any car you own. Zero obligation. Unlimited entries.', tag: 'Optional', duration: '~1 min' },
        { n: 3, pts: '30',  ptsUnit: 'Pts max',      title: 'Get social',        desc: 'Comment on 3 Clutch ads with something funny or quirky about your car. 10 points each.', tag: 'Optional', duration: '~1 min' },
      ];
      return (
        <section id="how" className="bg-black" style={{ padding: '120px 0' }}>
          <div className="wrap">
            {/* Header */}
            <div className="two-col" style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 64, alignItems: 'end', marginBottom: 64 }}>
              <div>
                <div className="t-label dim-light" style={{ marginBottom: 16 }}>How to Win</div>
                <h2 className="t-headline" style={{ color: 'white' }}>
                  Three steps. Up to 135 points. One shot at the X5.
                </h2>
              </div>
              <p className="t-body dim-light" style={{ margin: 0 }}>
                Only Step 1 is required to be eligible. The more you stack, the better your odds of driving home in the X5.
              </p>
            </div>

            {/* Grid */}
            <div className="c-steps">
              {steps.map(s => (
                <div key={s.n} className="c-step">
                  {/* Number + tag */}
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 28 }}>
                    <div style={{
                      width: 30, height: 30, borderRadius: '50%',
                      border: '1.5px solid rgba(255,255,255,.2)',
                      display: 'flex', alignItems: 'center', justifyContent: 'center',
                      color: 'rgba(255,255,255,.55)', fontSize: 13, fontWeight: 800,
                    }}>{s.n}</div>
                    {s.n === 1 && (
                      <span style={{ fontSize: 10, fontWeight: 700, letterSpacing: '.1em', textTransform: 'uppercase', padding: '3px 8px', borderRadius: 999, background: 'rgba(255,70,76,.15)', color: '#FF464C' }}>Required</span>
                    )}
                  </div>

                  {/* Points */}
                  <div style={{ marginBottom: 16 }}>
                    <span className="c-step-pts" style={{ color: 'white' }}>{s.pts}</span>
                    <span className="t-label dim-light" style={{ marginLeft: 8 }}>{s.ptsUnit}</span>
                  </div>

                  {/* Title + desc */}
                  <div style={{ fontSize: 19, fontWeight: 800, color: 'white', letterSpacing: '-0.01em', marginBottom: 10 }}>{s.title}</div>
                  <p className="t-small dim-light" style={{ margin: '0 0 28px', lineHeight: 1.6 }}>{s.desc}</p>

                  {/* Footer */}
                  <div style={{ paddingTop: 24, borderTop: '1px solid rgba(255,255,255,.1)', display: 'flex', alignItems: 'center', gap: 12 }}>
                    <button
                      onClick={() => onStepClick?.(s.n)}
                      style={{ background: 'none', border: 'none', padding: 0, fontSize: 13, fontWeight: 700, color: 'rgba(255,255,255,.4)', fontFamily: 'inherit', cursor: 'pointer' }}
                    >
                      Jump to Step {s.n}

            style={{ borderBottomColor: focused ? '#0A0A0A' : 'rgba(10,10,10,.18)' }}

                <span key={p.id} style={{
                  position: 'absolute', left: `${p.x}%`, top: '30%',

    const DEADLINE = "2026-05-20T11:01:00-04:00";

    function App() {
      const formRef = useRef(null);
      const scrollToForm = () => formRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      const scrollToStep = n => {
        const id = n === 1 ? 'step-1' : n === 2 ? 'enter-step-2' : 'step-3';
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
      return (
        <>
          <Nav onCta={scrollToForm} />
          <Hero deadlineIso={DEADLINE} onCtaClick={scrollToForm} />
          <WhyCertified />
          <HowToWin onStepClick={scrollToStep} />
          <EnterSection formRef={formRef} />
          <FAQ />
          <FinalCTA onCta={scrollToForm} />
          <Terms />
          <Footer />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
