  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body data-cc-id="cc-23" style="font-family: 'Nunito Sans'; font-size: 13.5px;">
  <div id="app"></div>


  <script type="text/babel" src="hero.v1.jsx" data-plugins="transform-react-jsx-source" data-filename="hero.v1.jsx"></script>
  <script type="text/babel" src="sections.v1.jsx" data-plugins="transform-react-jsx-source" data-filename="sections.v1.jsx"></script>
  <script type="text/babel" src="form.v1.jsx" data-plugins="transform-react-jsx-source" data-filename="form.v1.jsx"></script>
  <script type="text/babel" data-plugins="transform-react-jsx-source" data-filename="inline-3">


const { useRef: useRefApp, useState: useStateApp, useEffect: useEffectApp } = React;

const TWEAKS = /*EDITMODE-BEGIN*/{
  "deadline": "2026-05-20T11:01:00-04:00",
  "heroVariant": "bold",
  "darkMode": false
} /*EDITMODE-END*/;

function ClutchLogo() {
  return (
    <svg viewBox="0 0 118 29" width="98" height="24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path fill="#FF464C" d="M24.18 28.33h5.3V.18h-5.3v28.15zM48.9 7.8v11.09c0 3.57-2.03 4.99-4.55 4.99-2.38 0-4.03-1.33-4.03-4.12V7.8h-5.3v12.6c0 5.47 2.9 7.93 7.7 7.93 2.67 0 4.94-.59 6.17-2.44v2.44h5.3V7.8h-5.3zm22.92 4.92V7.63h-4.64V0h-5.3v7.63h-3.57v5.09h3.57v8.54c0 5.54 2.5 7.72 9.94 6.9v-4.8c-3.04.16-4.64.12-4.64-2.1V12.72h4.64zm38.42-5.49c-2.75 0-4.89 1.03-6.12 2.88V.18h-5.3v28.15h5.3V17.25c0-3.58 1.93-5.1 4.52-5.1 2.38 0 4.06 1.44 4.06 4.23v11.95H118V15.73c0-5.47-3.4-8.5-7.76-8.5zM15.7 27.17c1.88-.93 3.42-2.4 4.42-4.2l-4.76-2.26c-.38.61-.9 1.11-1.52 1.48l1.87 4.99zm-1.92.74l-1.96-4.94c-.33.05-.67.08-1.02.08-.37 0-.73-.03-1.08-.1L7.8 27.92c.95.26 1.97.4 3.04.4 1.02 0 2.01-.14 2.95-.4zM5.3 17.47c0 2.09.97 3.8 2.5 4.76L5.87 27.2C2.31 25.44 0 21.8 0 17.47 0 11.35 4.6 6.63 10.84 6.63c4.02 0 7.51 2.14 9.2 5.3L15.26 14.2c-.9-1.45-2.54-2.35-4.46-2.35-3.16 0-5.5 2.34-5.5 5.62zm80.45 10.84c4.02 0 7.51-2.14 9.28-5.34l-4.84-2.25c-.9 1.42-2.53 2.27-4.47 2.27-3.16 0-5.5-2.34-5.5-5.58 0-3.29 2.34-5.62 5.5-5.62 1.92 0 3.56.89 4.45 2.34l4.79-2.27c-1.69-3.16-5.18-5.3-9.2-5.3-6.24 0-10.84 4.72-10.84 10.84 0 6.12 4.6 10.84 10.84 10.84z" />
        </svg>);

}

function Nav({ onCta }) {
  return (
    <nav className="nav" style={{ opacity: "1" }}>
          <div className="nav-inner" style={{ justifyContent: 'center' }}>
            <a href="#" style={{ display: 'flex', alignItems: 'center' }}><ClutchLogo /></a>
          </div>
        </nav>);

}

function TweaksPanel({ tweaks, setTweaks, visible }) {
  if (!visible) return null;
  const update = (k, v) => {
    const next = { ...tweaks, [k]: v };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
  };
  return (
    <div style={{
      position: 'fixed', bottom: 20, right: 20, zIndex: 1000,
      background: 'white', borderRadius: 16, padding: 20, width: 280,
      boxShadow: '0 20px 50px rgba(0,0,0,.2)', border: '1px solid rgba(0,0,0,.08)',
      fontSize: 13
    }}>
          <div style={{ fontWeight: 800, marginBottom: 14, fontSize: 14 }}>Tweaks</div>
          <label style={{ display: 'block', marginBottom: 14 }}>
            <div style={{ marginBottom: 6, fontWeight: 600 }}>Deadline</div>
            <input type="datetime-local" value={tweaks.deadline.slice(0, 16)}
        onChange={(e) => update('deadline', e.target.value + ':00-04:00')}
        style={{ width: '100%', padding: 8, borderRadius: 8, border: '1px solid rgba(0,0,0,.15)', fontFamily: 'inherit' }} />
          </label>
          <div style={{ marginBottom: 10, fontWeight: 600 }}>Hero variant</div>
          <div style={{ display: 'flex', gap: 6 }}>
            {['default', 'bold', 'minimal'].map((v) =>
        <button key={v} onClick={() => update('heroVariant', v)}
        style={{
          flex: 1, padding: '8px 10px', borderRadius: 8,
          border: tweaks.heroVariant === v ? '2px solid var(--coral)' : '1px solid rgba(0,0,0,.12)',
          background: tweaks.heroVariant === v ? 'rgba(255,70,76,.08)' : 'white',
          fontSize: 12, fontWeight: 700, cursor: 'pointer', textTransform: 'capitalize'
        }}>{v}</button>
        )}
          </div>
        </div>);

}

function App() {
  const [tweaks, setTweaks] = useStateApp(TWEAKS);
  const [tweaksVisible, setTweaksVisible] = useStateApp(false);
  const formRef = useRefApp(null);

  useEffectApp(() => {
    const onMsg = (e) => {
      if (!e.data || typeof e.data !== 'object') return;
      if (e.data.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const scrollToForm = () => {
    formRef.current?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  const scrollToStep = (n) => {
    const el = document.getElementById(`step-${n}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });else
    scrollToForm();
  };

  return (
    <>
          <Nav onCta={scrollToForm} />
          <Hero deadlineIso={tweaks.deadline} onCtaClick={scrollToForm} />
          <WhyCertified />
          <div id="how"><HowToWin onStepClick={scrollToStep} /></div>
          <EnterSection formRef={formRef} />
          <FAQ />
          <FinalCTA onClick={scrollToForm} />
          <TermsAndConditions />
          <div id="rules"><Footer /></div>
          <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} visible={tweaksVisible} />
        </>);

}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>


</body></html>
