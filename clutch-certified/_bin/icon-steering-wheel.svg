<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Outer ring -->
  <circle cx="12" cy="12" r="10.5" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Inner rim -->
  <circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
  <!-- Top semicircle: 9-oclock → 3-oclock clockwise over the top -->
  <path d="M5.5 12 A6.5 6.5 0 0 1 18.5 12 Z" fill="currentColor"/>
  <!-- Bottom-left quarter: straight edges + arc clockwise from 6 → 9-oclock -->
  <path d="M5.5 12 L12 12 L12 18.5 A6.5 6.5 0 0 1 5.5 12 Z" fill="currentColor"/>
  <!-- Bottom-right quarter: straight edges + arc counter-clockwise from 6 → 3-oclock -->
  <path d="M18.5 12 L12 12 L12 18.5 A6.5 6.5 0 0 0 18.5 12 Z" fill="currentColor"/>
  <!-- White separator lines for visual gaps -->
  <line x1="5.5" y1="12" x2="18.5" y2="12" stroke="white" stroke-width="1"/>
  <line x1="12" y1="12" x2="12" y2="18.5" stroke="white" stroke-width="1"/>
</svg>
