  <!--
  ==============================================
    CLUTCH EMAIL STYLE TOKENS
  ==============================================

    COLORS
    --color-text-primary:     #191919
    --color-text-secondary:   #555555
    --color-bg-page:          #F5F4F2
    --color-bg-white:         #FFFFFF
    --color-lavender:         #F1EDF8
    --color-plum:             #48071D
    --color-red-cta-top:      #FF464C
    --color-red-cta-bottom:   #FF1C24
    --color-stars:            #F5A623

    TYPOGRAPHY
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif

    hero-display:   600  36px  #191919  lh 1.15  ls -0.5px
    headline:       600  32px  #191919  lh 1.15  ls -0.5px
    h2:             600  22px  #191919  lh 1.2   ls -0.3px
    h3:             600  15px  #191919  lh 1.3
    body:           500  14px  #555555  lh 1.6
    subtitle:       400  14px  #555555  lh 1.6   centered
    label:          600  14px  #191919
    button:         600  17px  #FFFFFF  ls -0.2px

    COMPONENTS
    button:         gradient(#FF1C24 → #FF464C), radius 99px,
                    shadow: 0.6px 0.6px 2px rgba(126,7,11,0.32) + inset 0px 1px 2px rgba(255,255,255,0.45)
                    padding: 14px 44px
    card-lavender:  bg #F1EDF8, radius 16px, padding 40px 70px (inside 440px container)
    icon-circle:    bg #48071D, 52×52px, white SVG heroicon 24px
    number-circle:  bg #191919, 44×44px, white numeral, 16px 600
    thumbnail:      radius 8px, display:block, height:auto, border:0
    quote-card:     top #F7F7F7 + bottom #FF464C, radius 14px, overflow hidden
    stars:          ★★★★★ color #F5A623, 20px, letter-spacing 3px

    ICONS: heroicons outline — viewBox="0 0 24 24", stroke-width="1.5", white, 24×24
  ==============================================
  -->

  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:0}
    a[x-apple-data-detectors]{color:inherit!important;text-decoration:inherit!important}
    #MessageViewBody a{color:inherit;text-decoration:none}
    p{line-height:inherit}
    .desktop_hide,.desktop_hide table{mso-hide:all;display:none;max-height:0;overflow:hidden}
    .image_block img+div{display:none}
    sub,sup{font-size:75%;line-height:0}
    @media (max-width:520px){
      .row-content{width:100%!important}
      .stack .column{width:100%;display:block}
      .mobile_hide{display:none}
      .desktop_hide,.desktop_hide table{display:table!important;max-height:none!important}
    }
  </style>
  <!--[if mso ]><style>sup, sub { font-size: 100% !important; } sup { mso-text-raise:10% } sub { mso-text-raise:-10% }</style><![endif]-->
