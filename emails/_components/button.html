<!-- ===================== CTA BUTTON ===================== -->
<!-- Replace [URL], [BUTTON_TEXT], and adjust VML width to match text length.     -->
<!-- VML width guide: ~160px = "View car", ~180px = "Shop Certified",             -->
<!--                  ~200px = "Get pre-approved", ~220px = "Shop all cars"       -->
<table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="mso-table-lspace:0;mso-table-rspace:0">
  <tbody><tr>
    <td style="padding:28px 15px 36px;text-align:center">
      <a href="[URL]" target="_blank" style="color:#ffffff;text-decoration:none;">
        <!--[if mso]>
        <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word"
          href="[URL]" style="height:52px;width:180px;v-text-anchor:middle;" arcsize="54%" fillcolor="#ff464c">
          <v:stroke dashstyle="Solid" weight="0px" color="#ff464c"/>
          <w:anchorlock/>
          <v:textbox inset="0px,0px,0px,0px">
          <center dir="false" style="color:#ffffff;font-family:'Poppins',Arial,sans-serif;font-size:17px;font-weight:600">
        <![endif]-->
        <span style="background-color:#FF464C;background-image:linear-gradient(to top,#FF1C24 0%,#FF464C 46.875%);border-radius:99px;box-shadow:0.6px 0.6px 2px 0px rgba(126,7,11,0.32),inset 0px 1px 2px 0px rgba(255,255,255,0.45);color:#ffffff;display:inline-block;font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:17px;font-weight:600;mso-border-alt:none;padding:14px 44px;text-align:center;word-break:keep-all;letter-spacing:-0.2px">[BUTTON_TEXT]</span>
        <!--[if mso]></center></v:textbox></v:roundrect><![endif]-->
      </a>
    </td>
  </tr></tbody>
</table>
