<!-- ===================== QUOTE / TESTIMONIAL CARD ===================== -->
<!-- Single rounded container: light grey top + red bottom.                       -->
<!-- Update: quote body, name, location, stars count.                             -->
<table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="mso-table-lspace:0;mso-table-rspace:0">
  <tbody><tr><td>
    <table align="center" border="0" cellpadding="0" cellspacing="0" role="presentation" style="mso-table-lspace:0;mso-table-rspace:0;background-color:#ffffff;width:480px;margin:0 auto;border-radius:0 0 12px 12px" width="480">
      <tbody><tr><td style="padding:0 24px 40px">

        <table width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="mso-table-lspace:0;mso-table-rspace:0;border-radius:14px;overflow:hidden">

          <!-- Top: quote mark + body -->
          <tbody><tr><td style="background-color:#F7F7F7;padding:24px 24px 16px">
            <p style="margin:0 0 -20px;font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:110px;font-weight:600;color:#191919;line-height:0.85">&rdquo;</p>
            <p style="margin:0;font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:15px;font-weight:400;color:#191919;line-height:1.7">Quote body goes here. Keep it genuine and specific — one or two sentences max.</p>
          </td></tr>

          <!-- Bottom: attribution -->
          <tr><td style="background-color:#FF464C;padding:20px 24px">
            <p style="margin:0 0 2px;font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:14px;font-weight:600;color:#ffffff;line-height:1.3">First Name L.</p>
            <p style="margin:0 0 10px;font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;font-size:14px;font-weight:600;color:#ffffff;line-height:1.3">City, ON</p>
            <p style="margin:0;font-size:20px;line-height:1;color:#F5A623;letter-spacing:3px">★★★★★</p>
          </td></tr>

        </tbody></table>

      </td></tr></tbody>
    </table>
  </td></tr></tbody>
</table>
