<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clutch Certified — Coin flip</title>
  <style>
    @font-face {
      font-family: 'CircularXX';
      src: url('./fonts/CircularXX-Regular.woff2') format('woff2'),
           url('./fonts/CircularXX-Regular.otf') format('opentype');
      font-weight: 400;
    }
    @font-face {
      font-family: 'CircularXX';
      src: url('./fonts/CircularXX-Medium.woff2') format('woff2'),
           url('./fonts/CircularXX-Medium.otf') format('opentype');
      font-weight: 500;
    }
    @font-face {
      font-family: 'CircularXX';
      src: url('./fonts/CircularXX-Bold.woff2') format('woff2'),
           url('./fonts/CircularXX-Bold.otf') format('opentype');
      font-weight: 700;
    }

    :root {
      --plum: #460B28;
      --red:  #FF464C;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'CircularXX', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--plum);
      color: #fff;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* ── nav ── */
    .nav {
      padding: 28px clamp(20px, 6%, 80px);
    }
    .nav__logo { height: 18px; width: auto; display: block; }

    /* ── main ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 44px;
      padding: 20px 20px 72px;
    }

    /* ── coin ── */
    .coin-wrap {
      perspective: 700px;
    }

    .coin {
      width: 260px;
      height: 260px;
      position: relative;
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .coin-face {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      will-change: transform;
      filter: drop-shadow(0 20px 44px rgba(0,0,0,0.55));
      transition: transform 1.8s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .coin-tails {
      transform: rotateX(180deg);
    }

    @keyframes coin-toss {
      0%   { transform: translateY(0); }
      25%  { transform: translateY(-36px); }
      100% { transform: translateY(0); }
    }

    /* ── result ── */
    .result {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .result__text {
      font-size: clamp(40px, 8vw, 64px);
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .result__text.visible { opacity: 1; transform: translateY(0); }
    .result__text.heads { color: #fff; }
    .result__text.tails { color: var(--red); }

    /* ── flip button ── */
    .flip-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 18px 52px;
      background: #fff;
      color: var(--plum);
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
      border: none;
      border-radius: 99px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .flip-btn:hover:not(:disabled) { transform: translateY(-2px); }
    .flip-btn:active:not(:disabled) { transform: scale(0.97); }
    .flip-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── counters ── */
    .counters { display: flex; gap: 48px; }
    .counter { text-align: center; }
    .counter__num {
      display: block;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1;
      color: rgba(255,255,255,0.75);
      margin-bottom: 4px;
    }
    .counter__label {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.35);
    }

    @media (max-width: 400px) {
      .coin { width: 210px; height: 210px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .result__text { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

<nav class="nav">
  <a href="./index.html">

    </svg>
  </a>
</nav>

<main class="main">

  <div class="coin-wrap">
    <div class="coin" id="coin" onclick="flip()">
      <img class="coin-face coin-heads" id="coinHeads" src="./cc-badge.png" alt="Heads">
      <img class="coin-face coin-tails" id="coinTails" src="./badge-back.png" alt="Tails">
    </div>
  </div>

  <div class="result">
    <span class="result__text" id="resultText"></span>
  </div>

  <button class="flip-btn" id="flipBtn" onclick="flip()">Flip</button>

  <div class="counters">
    <div class="counter">
      <span class="counter__num" id="headsCount">0</span>
      <span class="counter__label">Heads</span>
    </div>
    <div class="counter">
      <span class="counter__num" id="tailsCount">0</span>
      <span class="counter__label">Tails</span>
    </div>
  </div>

</main>

<script>
let headsRot = 0;
let tailsRot = 180;
let flipping = false;
let heads = 0;
let tails = 0;

function flip() {
  if (flipping) return;
  flipping = true;

  const coin     = document.getElementById('coin');
  const headsEl  = document.getElementById('coinHeads');
  const tailsEl  = document.getElementById('coinTails');
  const btn      = document.getElementById('flipBtn');
  const label    = document.getElementById('resultText');

  btn.disabled = true;
  label.classList.remove('visible', 'heads', 'tails');

  // toss the coin up
  coin.style.animation = 'none';
  void coin.offsetHeight;
  coin.style.animation = 'coin-toss 1.8s cubic-bezier(0.22, 1, 0.36, 1) forwards';

  // random half-spins — wherever it lands is the result
  const halfSpins = 12 + Math.floor(Math.random() * 9);
  headsRot += halfSpins * 180;
  tailsRot += halfSpins * 180;

  headsEl.style.transform = `rotateX(${headsRot}deg)`;
  tailsEl.style.transform  = `rotateX(${tailsRot}deg)`;

  setTimeout(() => {
    const isHeads = ((headsRot % 360) + 360) % 360 === 0;

    if (isHeads) {
      heads++;
      label.textContent = 'Heads';
      label.className = 'result__text heads';
      document.getElementById('headsCount').textContent = heads;
    } else {
      tails++;
      label.textContent = 'Tails';
      label.className = 'result__text tails';
      document.getElementById('tailsCount').textContent = tails;
    }
    label.classList.add('visible');
    btn.disabled = false;
    flipping = false;
  }, 1950);
}
</script>

</body>
</html>
